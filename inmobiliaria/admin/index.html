<!DOCTYPE html>

<title>Inmobiliaria · Gestión de compra, venta y renta</title>

<style>
:root{--bg:#0a0f1c;--panel:#111a2e;--panel2:#16213a;--line:#24324f;--tx:#e8eef8;--mu:#8d9cb8;--ac:#2dd4bf;--venta:#fbbf24;--renta:#a78bfa;--ok:#34d399;--bad:#f87171;--warn:#fb923c;--r:14px}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Outfit,system-ui,sans-serif;background:radial-gradient(1100px 600px at 85% -15%,#14305a 0,transparent 60%),radial-gradient(800px 500px at -10% 110%,#0f3a3a 0,transparent 55%),var(--bg);background-attachment:fixed;color:var(--tx);min-height:100vh;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:'JetBrains Mono',monospace}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;background:rgba(10,15,28,.6);backdrop-filter:blur(8px);display:flex;flex-direction:column}
.brand{display:flex;gap:10px;align-items:center;margin:0 6px 26px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--ac),#3b82f6);display:grid;place-items:center;box-shadow:0 0 22px #2dd4bf55}
.logo svg{width:22px;height:22px;stroke:#04131a}
.brand b{display:block;font-size:16px;line-height:1.1}
.brand small{color:var(--mu);font-size:12px}
nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;color:var(--mu);text-decoration:none;cursor:pointer;margin-bottom:3px;font-weight:500}
nav a svg{width:20px;height:20px}
nav a:hover{background:var(--panel);color:var(--tx)}
nav a.on{background:linear-gradient(90deg,#2dd4bf22,transparent);color:var(--ac);box-shadow:inset 3px 0 0 var(--ac)}
.side-foot{margin-top:auto;font-size:12px;color:var(--mu);padding:0 8px}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{padding:26px 30px 90px;max-width:1300px;width:100%}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.top h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.3px}
.top .sub{color:var(--mu);font-size:13px;margin-top:2px}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel2);padding:9px 15px;border-radius:10px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;text-decoration:none;color:var(--tx)}
.btn:hover{border-color:#3a4e78}
.btn svg{width:17px;height:17px}
.btn.pri{background:var(--ac);color:#04201c;border-color:var(--ac);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad);border-color:#5a2a35;background:transparent}
.btn.wa{color:#4ade80;border-color:#1f5137}
.iconbtn{width:40px;height:40px;padding:0;justify-content:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;position:relative;overflow:hidden}
.kpi:after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:var(--glow,#2dd4bf);opacity:.09}
.kpi span{color:var(--mu);font-size:12.5px;text-transform:uppercase;letter-spacing:.6px}
.kpi b{display:block;font-size:22px;margin:6px 0 2px;font-family:'JetBrains Mono',monospace}
.kpi small{color:var(--mu);font-size:12.5px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 .cnt{background:var(--panel2);color:var(--mu);font-size:12px;padding:2px 8px;border-radius:20px;font-weight:500}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{color:var(--mu);font-size:13px}
.empty{color:var(--mu);text-align:center;padding:22px;font-size:14px}
.chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;background:var(--panel2);color:var(--mu);border:1px solid var(--line);white-space:nowrap}
.c-venta{color:var(--venta);border-color:#5b4716;background:#fbbf2412}
.c-renta{color:var(--renta);border-color:#463a6e;background:#a78bfa12}
.c-ambas{color:var(--ac);border-color:#1d5450;background:#2dd4bf12}
.c-ok{color:var(--ok);border-color:#1d5440;background:#34d39912}
.c-bad{color:var(--bad);border-color:#5a2a35;background:#f8717112}
.c-warn{color:var(--warn);border-color:#5c3a1d;background:#fb923c12}
.c-info{color:#60a5fa;border-color:#1e3a66;background:#60a5fa12}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:10px 12px 10px 38px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--mu)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--mu);font-weight:500;font-size:14px}
.seg button.on{background:var(--panel2);color:var(--tx);box-shadow:0 0 0 1px var(--line)}
select.f{padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.prop{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s}
.prop:hover{transform:translateY(-2px);border-color:#3a5080}
.pimg{height:150px;position:relative;background-size:cover;background-position:center;display:grid;place-items:center}
.pimg .ph{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:#ffffffaa;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px}
.pimg .ph svg{width:38px;height:38px;stroke:#ffffffaa}
.pimg .st{position:absolute;top:10px;left:10px}
.pimg .op{position:absolute;top:10px;right:10px}
.st-Disponible{background:#0d3b2ecc;color:var(--ok);border-color:#1d5440}
.st-Apartada{background:#4a2f10cc;color:var(--warn);border-color:#5c3a1d}
.st-Rentada{background:#2e2552cc;color:var(--renta);border-color:#463a6e}
.st-Vendida{background:#4a1d26cc;color:var(--bad);border-color:#5a2a35}
.st-Inactiva{background:#222c40cc;color:var(--mu)}
.pbody{padding:13px 14px}
.pbody h4{margin:0 0 3px;font-size:15.5px}
.pbody .loc{color:var(--mu);font-size:13px;margin-bottom:9px}
.price{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:16px}
.price.v{color:var(--venta)}.price.r{color:var(--renta)}
.price small{font-size:12px;color:var(--mu);font-weight:500}
.specs{display:flex;gap:12px;color:var(--mu);font-size:12.5px;margin-top:9px;flex-wrap:wrap}
.list{display:grid;gap:10px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.item .grow{flex:1;min-width:200px}
.item .t{font-weight:600}
.item .m{color:var(--mu);font-size:13px;margin-top:2px}
.av{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:15px;flex-shrink:0}
.bar{height:8px;background:var(--panel2);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:6px}
.statbar{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13.5px}
.statbar .lb{width:90px;color:var(--mu)}
.statbar .bar{flex:1;margin:0;height:10px}
.statbar .n{width:28px;text-align:right;font-family:'JetBrains Mono',monospace}
.subtabs{margin-bottom:16px}
.inline-sel{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-size:13px}
#modal{position:fixed;inset:0;background:#030712bb;backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:40px 14px}
#modal.on{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:100%;max-width:640px;padding:22px;box-shadow:0 30px 80px #000a;animation:pop .18s ease}
@keyframes pop{from{transform:translateY(10px);opacity:0}}
.mbox h3{margin:0 0 16px;font-size:19px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mu)}
.grid label.full{grid-column:1/-1}
.grid input,.grid select,.grid textarea{padding:10px 11px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:15px;width:100%}
.grid input:focus,.grid select:focus,.grid textarea:focus,.search input:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px #2dd4bf22}
.mact{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.photo-in{display:flex;gap:10px;align-items:center}
.photo-in img{width:90px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.det-img{height:220px;border-radius:12px;margin:-4px 0 14px;background-size:cover;background-position:center;display:grid;place-items:center}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:12px 0}
.dl div{background:var(--panel2);border-radius:10px;padding:9px 11px}
.dl span{display:block;color:var(--mu);font-size:12px}
.dl b{font-size:14.5px}
.fsec{grid-column:1/-1;font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--ac);border-top:1px solid var(--line);padding-top:14px;margin-top:4px;font-weight:600}
.fsec:first-child{border-top:0;padding-top:0;margin-top:0}
.fld{display:flex;flex-direction:column;gap:7px;font-size:13px;color:var(--mu)}.fld.full{grid-column:1/-1}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.grid label.mc{display:inline-block}
.mc input{position:absolute;opacity:0;pointer-events:none}
.mc span{display:inline-block;padding:6px 11px;border:1px solid var(--line);border-radius:20px;cursor:pointer;color:var(--mu);font-size:13px;background:var(--bg);user-select:none}
.mc input:checked+span{border-color:var(--ac);color:var(--ac);background:#2dd4bf18}
.phs{display:flex;gap:8px;flex-wrap:wrap}
.phs .th{position:relative;width:92px;height:70px;border-radius:9px;background-size:cover;background-position:center;border:1px solid var(--line)}
.th button{position:absolute;top:3px;width:22px;height:22px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:11px;cursor:pointer;padding:0;left:3px}
.th button.x{left:auto;right:3px}
.th em{position:absolute;bottom:3px;left:3px;font-size:10px;font-style:normal;background:var(--ac);color:#04201c;padding:1px 6px;border-radius:6px;font-weight:600}
textarea.out{width:100%;height:160px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px;font-family:'JetBrains Mono',monospace;font-size:12px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--panel2);border:1px solid var(--ac);color:var(--tx);padding:11px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:60;pointer-events:none;box-shadow:0 10px 30px #0008;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
#pv{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column}
#pv .pvbar{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
#pv iframe{flex:1;border:0;width:100%;background:#fff}
footer{text-align:center;color:var(--mu);font-size:13px;padding:30px 0 10px}
footer b{color:var(--ac);font-weight:600}
.bnav{display:none}
@media (max-width:860px){
 .app{grid-template-columns:1fr}
 aside{display:none}
 main{padding:18px 14px 100px}
 .cols{grid-template-columns:1fr}
 .top h1{font-size:22px}
 .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(12,18,33,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--mu);padding:5px 0;cursor:pointer}
 .bnav a svg{width:21px;height:21px}
 .bnav a.on{color:var(--ac)}
 .grid{grid-template-columns:1fr}
 .kpi b{font-size:19px}
 .kpis{grid-template-columns:1fr 1fr}
 #toast{bottom:90px}
 .mbox{padding:18px}
}
</style>
</head>

 <aside>

<script>

const money=n=>(+n||0).toLocaleString('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0});
const short=n=>{n=+n||0;if(n>=1e6)return '$'+(n/1e6).toFixed(n>=1e7?1:2).replace(/\.?0+$/,'')+'M';if(n>=1e4)return '$'+Math.round(n/1e3)+'k';return money(n)};

 home:'M3 11l9-8 9 8M5 10v10h14V10',

};
const ic=(k,c='i')=>`<svg class="${c}" viewBox="0 0 24 24"><path d="${IC[k]}"/></svg>`;
const NAV=[['inicio','Inicio','home'],['propiedades','Propiedades','prop'],['clientes','Clientes','users'],['ventas','Ventas','tag'],['rentas','Rentas','key'],['agenda','Agenda','cal'],['portal','Portal','globe']];

/* ---------- rentas: periodos de pago ---------- */
function endDate(c){const s=parse(c.inicio);return new Date(s.getFullYear(),s.getMonth()+(+c.meses||12),s.getDate()-1)}
function periods(c,all){
 const out=[];if(!c.inicio)return out;const s=parse(c.inicio);const lim=addDays(TODAY,35);
 for(let i=0;i<(+c.meses||12);i++){
  const y=s.getFullYear(),m=s.getMonth()+i;const last=new Date(y,m+1,0).getDate();
  const due=new Date(y,m,Math.min(+c.dia||1,last));
  if(!all&&due>lim)break;
  const per=iso(new Date(y,m,1)).slice(0,7);
  const pay=db.payments.find(p=>p.contrato===c.id&&p.periodo===per);
  out.push({c,periodo:per,due:iso(due),monto:+c.renta,pay,st:pay?'Pagado':(due<TODAY?'Vencido':'Pendiente'),dias:Math.round((TODAY-due)/864e5)});
 }
 return out;
}
const activeC=()=>db.contracts.filter(c=>c.estatus==='Activo');
const allPer=()=>activeC().flatMap(c=>periods(c));

function shrink(file){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const w=Math.min(900,im.width),h=Math.round(im.height*w/im.width);const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);res(cv.toDataURL('image/jpeg',.66));URL.revokeObjectURL(im.src)};im.onerror=rej;im.src=URL.createObjectURL(file)})}

function openForm(title,fields,vals,onSave,onDel){
 const body=fields.map(f=>{
  const v=vals[f.k]??f.def??'';let inp;
  if(f.type==='section')return `<div class="fsec">${f.label}</div>`;
  if(f.type==='multi'){const arr=Array.isArray(v)?v:[];return `<div class="fld full"><span>${f.label}</span><div class="mchips">${f.opts.map(([val,lab])=>`<label class="mc"><input type="checkbox" name="${f.k}" value="${esc(val)}" ${arr.includes(val)?'checked':''}><span>${esc(lab)}</span></label>`).join('')}</div></div>`}
  if(f.type==='photos'){const arr=Array.isArray(v)?v:[];return `<div class="fld full"><span>Fotos (hasta 8 · la primera es la portada · ★ para hacerla portada)</span><div class="phs" id="phs"></div><input type="file" accept="image/*" multiple data-photos><input type="hidden" name="${f.k}" value="${esc(JSON.stringify(arr))}"></div>`}
  if(f.type==='select')inp=`<select name="${f.k}" ${f.req?'required':''}>${f.opts.map(o=>{const[val,lab]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(lab)}</option>`}).join('')}</select>`;
  else if(f.type==='textarea')inp=`<textarea name="${f.k}" rows="3">${esc(v)}</textarea>`;
  else if(f.type==='photo')inp=`<div class="photo-in"><img id="phprev" src="${v}" ${v?'':'hidden'}><input type="file" accept="image/*" data-photo><input type="hidden" name="${f.k}" value="${esc(v)}"></div>`;
  else if(f.type==='check')inp=`<input type="checkbox" name="${f.k}" ${v?'checked':''} style="width:22px;height:22px">`;
  else inp=`<input name="${f.k}" type="${f.type||'text'}" value="${esc(v)}" ${f.step?`step="${f.step}"`:''} ${f.req?'required':''} ${f.ph?`placeholder="${esc(f.ph)}"`:''}>`;
  return `<label class="${f.full?'full':''}"><span>${f.label}</span>${inp}</label>`;
 }).join('');
 modal(`<form id="frm"><h3>${title}</h3><div class="grid">${body}</div><div class="mact">${onDel?'<button type="button" class="btn danger" id="delbtn">Eliminar</button>':''}<span class="sp"></span><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn pri">Guardar</button></div></form>`);
 const fi=$('[data-photo]');if(fi)fi.onchange=async()=>{const f=fi.files[0];if(!f)return;try{const d=await shrink(f);fi.nextElementSibling.value=d;const im=$('#phprev');im.src=d;im.hidden=false}catch(e){toast('No se pudo leer la imagen')}};
 const fp=$('[data-photos]');if(fp){const hid=fp.nextElementSibling;let arr=JSON.parse(hid.value||'[]');const draw=()=>{hid.value=JSON.stringify(arr);$('#phs').innerHTML=arr.map((f,i)=>`<div class="th" style="background-image:url(${f})">${i?`<button type="button" data-cover="${i}" title="Hacer portada">★</button>`:'<em>Portada</em>'}<button type="button" class="x" data-rm="${i}" title="Quitar">✕</button></div>`).join('')||'<span style="color:var(--mu);font-size:13px">Sin fotos</span>'};draw();
  $('#phs').onclick=e=>{const r=e.target.dataset.rm,c=e.target.dataset.cover;if(r!==undefined){arr.splice(+r,1);draw()}if(c!==undefined){arr.unshift(arr.splice(+c,1)[0]);draw()}};
  fp.onchange=async()=>{for(const f of [...fp.files]){if(arr.length>=8){toast('Máximo 8 fotos');break}try{arr.push(await shrink(f))}catch(e){toast('No se pudo leer una imagen')}}fp.value='';draw()}}
 if(onDel)$('#delbtn').onclick=onDel;
 $('#frm').onsubmit=e=>{e.preventDefault();const o={};const fd=new FormData(e.target);fd.forEach((v,k)=>o[k]=typeof v==='string'?v.trim():v);fields.forEach(f=>{if(f.type==='number')o[f.k]=+o[f.k]||0;if(f.type==='check')o[f.k]=!!o[f.k];if(f.type==='multi')o[f.k]=fd.getAll(f.k);if(f.type==='photos'){try{o[f.k]=JSON.parse(o[f.k]||'[]')}catch(x){o[f.k]=[]}}if(f.k==='plantas')o[f.k]=+o[f.k]||0});onSave(o);closeModal();save();render()};
}

 }
 const L=(state.cob==='Todos'?per:per.filter(x=>x.st===state.cob)).sort((a,b)=>state.cob==='Pagado'?b.due.localeCompare(a.due):a.due.localeCompare(b.due));
 return top+`<div class="filters"><div class="seg">${['Vencido','Pendiente','Pagado','Todos'].map(o=>`<button class="${state.cob===o?'on':''}" onclick="state.cob='${o}';render()">${o==='Todos'?o:o+'s'} ${o!=='Todos'?`(${cnt(o)})`:''}</button>`).join('')}</div></div><div class="list">${L.length?L.map(payRow).join(''):'<div class="empty">Nada por aquí</div>'}</div>`;

 return `<div class="item"><div class="av" style="background:#ffffff08;color:var(--mu);font-size:11px;text-align:center;line-height:1.15">${fper(x.periodo).split(' ')[0].slice(0,3).toUpperCase()}<br>${x.periodo.slice(2,4)}</div><div class="grow"><div class="t">${esc(cName(x.c.inquilino))} · <span style="font-weight:400;color:var(--mu)">${esc(pName(x.c.prop))}</span></div><div class="m">${fper(x.periodo)} · vence ${fdate(x.due)}${x.pay?` · pagado ${fdate(x.pay.fecha)} (${esc(x.pay.metodo)})`:''}</div></div><span class="chip ${ch}">${x.st==='Vencido'?x.dias+' días vencido':x.st}</span><div class="price r">${money(x.pay?x.pay.monto:x.monto)}</div>${x.pay?`<button class="btn sm" onclick="recibo('${x.pay.id}')">Recibo</button><button class="btn sm ghost" onclick="deshacer('${x.pay.id}')" title="Deshacer pago">↺</button>`:`<button class="btn sm pri" onclick="cobrar('${x.c.id}','${x.periodo}')">${ic('money')}Cobrar</button>`}</div>`;

function cobrar(cid,per){
 const c=db.contracts.find(x=>x.id===cid);
 openForm(`Registrar pago · ${fper(per)}`,[
  {k:'monto',label:'Monto recibido',type:'number',req:true},{k:'fecha',label:'Fecha de pago',type:'date',req:true},
  {k:'metodo',label:'Método',type:'select',opts:['Transferencia','Efectivo','Depósito','Tarjeta','Cheque']},{k:'nota',label:'Nota / referencia'}
 ],{monto:c.renta,fecha:iso(TODAY)},o=>{db.payments.push({id:uid(),contrato:cid,periodo:per,...o});toast('Pago registrado ✓')});

function deshacer(pid){askConfirm('Se quitará este pago y el mes volverá a quedar pendiente.',()=>{db.payments=db.payments.filter(p=>p.id!==pid)},'Quitar pago')}
function recibo(pid){const p=db.payments.find(x=>x.id===pid),c=db.contracts.find(x=>x.id===p.contrato);copyText(`🧾 RECIBO DE RENTA\n${db.cfg.agencia}\n\nRecibí de: ${cName(c.inquilino)}\nInmueble: ${pName(c.prop)}\nPeriodo: ${fper(p.periodo)}\nMonto: ${money(p.monto)}\nFecha de pago: ${fdate(p.fecha)}\nMétodo: ${p.metodo}${p.nota?'\nRef: '+p.nota:''}\n\nFolio: ${p.id.toUpperCase()}`)}
function pagosDe(cid){const c=db.contracts.find(x=>x.id===cid);const ps=periods(c,true);const tot=ps.filter(x=>x.pay).reduce((s,x)=>s+(+x.pay.monto||0),0);modal(`<h3>Pagos · ${esc(pName(c.prop))}</h3><div style="color:var(--mu);font-size:13px;margin-bottom:10px">${esc(cName(c.inquilino))} · cobrado ${money(tot)} de ${money(c.renta*ps.length)}</div>${ps.map(x=>{const ch=x.st==='Pagado'?'c-ok':x.st==='Vencido'?'c-bad':'';return `<div class="row"><div class="grow"><div class="t" style="text-transform:capitalize">${fper(x.periodo)}</div><div class="m">vence ${fdate(x.due)}${x.pay?' · pagado '+fdate(x.pay.fecha):''}</div></div><span class="chip ${ch}">${x.st}</span>${!x.pay&&x.st!=='Pendiente'||(!x.pay&&x.due<=iso(addDays(TODAY,35)))?`<button class="btn sm" onclick="cobrar('${c.id}','${x.periodo}')">Cobrar</button>`:''}</div>`}).join('')}<div class="mact"><span class="sp"></span><button class="btn" data-close>Cerrar</button></div>`)}

function formContract(id,pre){
 const c=id?db.contracts.find(x=>x.id===id):Object.assign({inicio:iso(new Date(TODAY.getFullYear(),TODAY.getMonth(),1)),meses:12,dia:1,estatus:'Activo'},pre);
 if(!id&&c.prop&&!c.renta){c.renta=prop(c.prop)?.renta||0;c.deposito=c.renta}
 openForm(id?'Editar contrato':'Nuevo contrato de renta',[
  {k:'prop',label:'Propiedad',type:'select',req:true,full:true,opts:[['','— Elige —'],...db.props.filter(p=>p.operacion!=='Venta'&&(p.estado==='Disponible'||p.id===c.prop)).map(p=>[p.id,`${p.titulo} · ${money(p.renta)}/mes`])]},
  {k:'inquilino',label:'Inquilino',type:'select',req:true,opts:[['','— Elige —'],...db.clients.filter(x=>x.tipo!=='Propietario').map(x=>[x.id,x.nombre])]},

 ],c,o=>{o.dia=Math.min(31,Math.max(1,o.dia||1));o.meses=Math.max(1,o.meses||12);let x;if(id){const old=c.prop;x=Object.assign(c,o);if(old!==o.prop){const op=prop(old);if(op&&op.estado==='Rentada')op.estado='Disponible'}}else{x={id:uid(),...o};db.contracts.unshift(x)}syncContract(x);toast('Contrato guardado')},
 id?()=>askConfirm('Se eliminará el contrato y su historial de pagos.',()=>{db.contracts=db.contracts.filter(x=>x.id!==id);db.payments=db.payments.filter(p=>p.contrato!==id);const p=prop(c.prop);if(p&&p.estado==='Rentada')p.estado='Disponible'}):null);
}

 const n=k=>k==='activas'?db.visits.filter(v=>!v.hecho&&v.fecha>=t).length:k==='atrasadas'?db.visits.filter(v=>!v.hecho&&v.fecha<t).length:db.visits.filter(v=>v.hecho).length;

   const n=db.props.filter(enPortal).length;
   const nc=await api('/git/commits',{method:'POST',body:{message:`Inmobiliaria: actualiza portal (${n} propiedades)`,tree:nt.sha,parents:[head]}});
   try{await api(`/git/refs/heads/${g.branch}`,{method:'PATCH',body:{sha:nc.sha}})}catch(e){if(intento<2&&(e.status===422||e.status===409)){log('La web cambió mientras publicaba, reintentando…');continue}throw e}
   db.cfg.lastPub={at:Date.now(),n};save();
   log(`✅ Publicado: ${n} propiedades${subidas?`, ${subidas} foto(s) nueva(s)`:''}.\nGitHub Pages tarda ~1 minuto en mostrar los cambios.\n${siteURL(g)}`);
   toast('¡Portal publicado en la web! 🚀');break;
  }
 }catch(e){const m=String(e.message||e);log('❌ '+(e.status===401?'Token inválido o vencido.':e.status===403?'El token no tiene permiso de escritura (Contents: Read and write) en '+g.repo+'.':e.status===404?'No encontré el repositorio o la rama. Revisa el nombre y que el token tenga acceso a ese repositorio.':/Failed to fetch|NetworkError|Load failed/i.test(m)?'No hay conexión con GitHub'+(IS_WEB?'.':' (en la versión de Claude está bloqueado; usa la versión instalada).'):m))}
 finally{publishing=false}
}
function togP(id,k){const p=prop(id);p[k]=!p[k];save();render()}
function savePortalCfg(){const v=i=>$(i).value.trim();Object.assign(db.cfg,{agencia:v('#pAg')||'Inmobiliaria',ciudad:v('#pCi'),whatsapp:v('#pWa'),telefono:v('#pTe'),email:v('#pEm'),eslogan:v('#pEs')});save();render();toast('Datos del portal guardados')}
function previewPortal(){const o=document.createElement('div');o.id='pv';o.innerHTML=`<div class="pvbar"><b>Vista previa del portal</b><span class="sp"></span><button class="btn sm pri" onclick="downloadPortal()">${ic('down')}Descargar</button><button class="btn sm" onclick="document.getElementById('pv').remove()">✕ Cerrar</button></div><iframe></iframe>`;document.body.appendChild(o);o.querySelector('iframe').srcdoc=portalHTML()}
async function downloadPortal(){const h=portalHTML();if(!DL&&IS_WEB){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download='index.html';document.body.appendChild(a);a.click();a.remove();toast('Portal descargado ✓');return}catch(e){}}if(DL){try{await DL.save({filename:'index.html',data:h});toast('Portal descargado ✓');return}catch(e){if(e&&/declin|cancel|abort/i.test(String(e.message||e.code||e)))return}}copyText(h);toast('Copia el HTML y guárdalo como index.html')}

 modal(`<h3>⚙ Ajustes</h3><div class="grid"><label><span>Nombre de la inmobiliaria</span><input id="sAg" value="${esc(db.cfg.agencia)}"></label><label><span>Comisión de venta por defecto (%)</span><input id="sCo" type="number" step="0.1" value="${db.cfg.comision}"></label></div>

 <textarea class="out" id="sJson" placeholder="Pega aquí un respaldo para importarlo…"></textarea>

 $('#sSave').onclick=()=>{db.cfg.agencia=$('#sAg').value.trim()||'Inmobiliaria';db.cfg.comision=+$('#sCo').value||0;save();closeModal();render();toast('Ajustes guardados')};

 $('#sDemo').onclick=()=>askConfirm('Se reemplazarán tus datos actuales por los de ejemplo.',()=>demo(),'Reemplazar');
 $('#sClr').onclick=()=>askConfirm('Se borrarán todas las propiedades, clientes, ventas, contratos, pagos y citas.',()=>{db={cfg:db.cfg,props:[],clients:[],sales:[],contracts:[],payments:[],visits:[]}},'Borrar todo');
}
