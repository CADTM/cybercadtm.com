<script>
const LOGO='<svg viewBox="0 0 190 46" xmlns="http://www.w3.org/2000/svg"><text x="0" y="25" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#0067b1">Almacén</text><text x="1" y="42" font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="3.6" fill="#0067b1">MONTACARGAS</text></svg>';
const CLIENT=true,FN=CLIENT?'cliente.html':'index.html',SK=CLIENT?'mx3c':'mc2';
const $=s=>document.querySelector(s),H=new Date;

const G1='Swing Reach',G2='Order Picker y Hombre parado',grp=t=>t=='Swing Reach'?G1:G2;
const seed=()=>({f:[{id:'SR-01',t:'Swing Reach',s:'Operativo',h:1240,b:82},{id:'SR-02',t:'Swing Reach',s:'Operativo',h:980,b:64},{id:'SR-03',t:'Swing Reach',s:'Operativo',h:1510,b:45},{id:'OP-01',t:'Order Picker',s:'Operativo',h:2105,b:90},{id:'OP-02',t:'Order Picker',s:'Operativo',h:452,b:28},{id:'HP-01',t:'Hombre parado',s:'Operativo',h:870,b:71},{id:'HP-02',t:'Hombre parado',s:'Operativo',h:1320,b:53}],

k:[],mv:[],a:[],e:[],ra:[],b:[]});
let S;try{S=JSON.parse(localStorage.getItem(SK))}catch(e){}S=S||seed();mig();
function mig(){S.seen=S.seen||[];S.ce=S.ce||[];S.ae=S.ae||[];S.k.forEach(k=>{if(!k.id)k.id=uid()});(S.ra=S.ra||[]).forEach(r=>{if(r.c==null)r.c=(r.p||[]).find(n=>n)||''});S.k.forEach(k=>{if(k.fails.includes('Extintor y limpieza'))k.fails=k.fails.filter(x=>x!='Extintor y limpieza').concat(['Extintor','Limpieza de montacargas'])});S.mv=S.mv||[];S.logo=S.logo||'';S.a=S.a||[];S.e=S.e||[];S.ra=S.ra||[];S.b=S.b||[];S.mi=S.mi||250;S.f.forEach(u=>{if(u.ms==null)u.ms=u.h});S.c.forEach(c=>{if(c.s=='Libre'||c.s=='Cargando')c.s='Funcionando';c.r=c.r||'';c.n=c.n||''})}

$('#nav').onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;draw()}};
setInterval(()=>$('#clk').textContent=new Date().toLocaleString('es-MX',{dateStyle:'medium',timeStyle:'short'}),1000);
function ask(title,fields,cb){const f=$('#fm'),d=$('#dlg'),v=x=>String(x==null?'':x).replace(/"/g,'&quot;');
f.innerHTML=`<h3 style="margin-bottom:14px">${title}</h3><div class="f" style="grid-template-columns:1fr">${fields.map(q=>`<label>${q[1]}${q[2]?`<select name="${q[0]}">${q[2].map(o=>`<option ${o==q[4]?'selected':''}>${o}</option>`).join('')}</select>`:`<input name="${q[0]}" ${q[3]||''} value="${v(q[4])}">`}</label>`).join('')}</div><div class="act"><button class="b p" type="submit">Guardar</button><button class="b" type="button" id="cx">Cancelar</button></div>`;
d.classList.add('on');$('#cx').onclick=()=>d.classList.remove('on');
f.onsubmit=e=>{e.preventDefault();const o={};new FormData(f).forEach((x,k)=>o[k]=x);d.classList.remove('on');cb(o);save();draw()}}
function donut(data){const T=data.reduce((a,b)=>a+b[1],0)||1;let off=0;const R=52,L=2*Math.PI*R;
return `<svg viewBox="0 0 250 150" width="100%"><g transform="translate(75,75) rotate(-90)"><circle r="${R}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="16"/>${data.map(d=>{const l=d[1]/T*L,s=`<circle r="${R}" fill="none" stroke="${d[2]}" stroke-width="16" stroke-dasharray="${l} ${L-l}" stroke-dashoffset="${-off}" style="filter:drop-shadow(0 0 6px ${d[2]})"/>`;off+=l;return s}).join('')}</g><text x="75" y="80" text-anchor="middle" style="font-size:26px;fill:#e6ecff">${T}</text>${data.map((d,i)=>`<circle cx="160" cy="${40+i*24}" r="5" fill="${d[2]}"/><text x="172" y="${44+i*24}">${d[0]} · ${d[1]}</text>`).join('')}</svg>`}
function week(){const n=S.f.length||1,o=[];for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*864e5),k=day(d);o.push([d.toLocaleDateString('es-MX',{weekday:'short'}),new Set(S.k.filter(x=>x.d==k).map(x=>x.f)).size/n])}
return `<svg viewBox="0 0 400 170" width="100%"><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#33a3ee"/><stop offset="1" stop-color="#0067b1"/></linearGradient></defs>${[0,.5,1].map(v=>`<line x1="30" x2="395" y1="${130-v*110}" y2="${130-v*110}" stroke="rgba(120,160,255,.15)"/><text x="0" y="${134-v*110}">${v*100}%</text>`).join('')}${o.map((d,i)=>`<rect x="${44+i*52}" y="${130-d[1]*110}" width="30" height="${d[1]*110}" rx="6" fill="url(#gg)" style="filter:drop-shadow(0 0 6px rgba(51,163,238,.5))"/><text x="${59+i*52}" y="150" text-anchor="middle">${d[0]}</text>`).join('')}</svg>`}

const al=[...f.filter(x=>x.s!='Operativo').map(x=>[C[col[x.s]],`${x.id} en estado ${x.s.toLowerCase()}`]),...S.c.filter(x=>x.s!='Funcionando').map(x=>[x.s=='Falla'?C.bd:C.wa,`Cargador ${x.id}: ${x.s.toLowerCase()}`]),...S.f.filter(x=>mt(x).c!='ok').map(x=>[mt(x).c=='bd'?C.bd:C.wa,`${x.id}: mantenimiento ${mt(x).t}`]),...S.e.filter(x=>x.s=='En revisión').map(x=>[C.wa,`Escáner ${x.id} en revisión`]),...S.ra.filter(x=>x.s=='En revisión').map(x=>[C.wa,`Radio ${x.id} en revisión`]),...S.a.filter(x=>x.s=='En revisión').map(x=>[C.wa,`Arnés ${x.id} en revisión`]),...low.map(x=>[C[st(x)],`${x.n}: quedan ${x.q} (mínimo ${x.m})`]),...f.filter(x=>x.s=='Operativo'&&!S.k.some(k=>k.d==day()&&k.f==x.id)).map(x=>[C.wa,`${x.id} sin checklist hoy`])];
return `<div class="g k4"><div class="card kpi a"><b>${ok}/${f.length}</b><span>Montacargas operativos</span></div><div class="card kpi d"><b>${hoy}/${f.length}</b><span>Checklists de hoy</span></div><div class="card kpi b"><b>${cu}/${S.c.length}</b><span>Cargadores funcionando</span></div><div class="card kpi c"><b>${low.length}</b><span>Insumos por reponer</span></div></div>
